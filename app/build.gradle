plugins {
    id 'com.android.application'
}

// Optional private signing configuration; never commit this file or its key.
def distributionSigning = new Properties()
def signingFilePath = providers.gradleProperty('openmirrorSigningProperties').orNull
if (signingFilePath != null) {
    file(signingFilePath).withInputStream { distributionSigning.load(it) }
}

android {
    namespace 'com.codelphi.airplay'
    buildFeatures { buildConfig true }

    compileSdk 34
    ndkVersion '26.3.11579264'

    defaultConfig {
        applicationId 'org.openmirror.presentation'
        minSdk 24
        targetSdk 34
        versionCode 4
        versionName '0.1.3-experimental'

        ndk { abiFilters 'armeabi-v7a' }

        externalNativeBuild {
            cmake {
                arguments '-DANDROID_STL=c++_static'
                cppFlags ''
            }
        }
    }

    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            version '3.22.1'
        }
    }

    signingConfigs {
        if (signingFilePath != null) {
            create('distribution') {
                storeFile file(distributionSigning.getProperty('storeFile'))
                storePassword distributionSigning.getProperty('storePassword')
                keyAlias distributionSigning.getProperty('keyAlias')
                keyPassword distributionSigning.getProperty('keyPassword')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled false
            if (signingFilePath != null) {
                signingConfig signingConfigs.distribution
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/LICENSE', 'META-INF/NOTICE', 'META-INF/*.md', 'META-INF/DEPENDENCIES']
        }
    }
}

/* 刻意不引入任何依赖：这台索尼电视的 ROM 不加载 classes.dex 以外的 dex，
   无第三方依赖可保证 dex 天然只有一个 */
